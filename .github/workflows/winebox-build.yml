name: WineBox Android build

on:
  push:
    branches:
      - main
      - winebox/integration
  pull_request:
    branches:
      - main
      - winebox/integration
  workflow_dispatch:

jobs:
  build:
    name: Build WineBox APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK and CMake
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Download Gradle with retries
        run: |
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 30 --max-time 600 https://downloads.gradle.org/distributions/gradle-8.14.5-bin.zip --output /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          /opt/gradle-8.14.5/bin/gradle --version

      - name: Build debug APK
        working-directory: app
        run: |
          chmod +x gradlew
          /opt/gradle-8.14.5/bin/gradle --no-daemon assembleDebug

      - name: Upload WineBox APK
        uses: actions/upload-artifact@v4
        with:
          name: winebox-debug-apk
          path: app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
